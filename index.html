<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyke Studio · Création de sites web</title>
  <meta name="description" content="Pyke Studio, création de sites web pour les artisans et commerçants. Site en construction.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b2239;
      --navy-2: #12324f;
      --turquoise: #2ee6d6;
      --text: #e8f1f8;
      --muted: #9fb3c6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(46, 230, 214, 0.18), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(46, 230, 214, 0.10), transparent 40%),
        linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    }
    main { max-width: 560px; text-align: center; }
    .logo {
      font-size: clamp(3rem, 12vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .logo span { color: var(--turquoise); }
    .studio {
      display: block;
      margin-top: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      margin: 36px 0 18px;
      padding: 6px 14px;
      border: 1px solid rgba(46, 230, 214, 0.5);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--turquoise);
    }
    h1 { font-size: clamp(1.4rem, 5vw, 1.9rem); font-weight: 600; line-height: 1.3; }
    p { margin-top: 14px; color: var(--muted); line-height: 1.6; }
    .contact {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 26px;
      border-radius: 12px;
      background: var(--turquoise);
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    .contact:hover { transform: translateY(-2px); }
    .socials { margin-top: 22px; font-size: 0.95rem; }
    .socials a { color: var(--text); text-decoration: none; margin: 0 10px; opacity: 0.8; }
    .socials a:hover { opacity: 1; color: var(--turquoise); }
  </style>
</head>
<body>
  <main>
    <div class="logo">pyke<span>.</span></div>
    <span class="studio">studio</span>

    <div class="badge">Site en construction</div>
    <h1>Des sites web modernes pour les artisans et commerçants</h1>
    <p>Notre site arrive très bientôt. En attendant, une question ou un projet ? Écrivez-nous.</p>

    <a class="contact" href="mailto:contact@pykestudio.fr">contact@pykestudio.fr</a>

    <div class="socials">
      <a href="https://www.instagram.com/pyke.studio" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@pyke.studio" target="_blank" rel="noopener">TikTok</a>
    </div>
  </main>
</body>
</html>
